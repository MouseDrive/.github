name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The **Setup** window in MouseDrive checks every requirement, and the README has a [Troubleshooting](https://github.com/MouseDrive/MouseDrive#troubleshooting) section. For questions, use [Discussions](https://github.com/MouseDrive/MouseDrive/discussions/categories/q-a). English or Turkish is fine.
  - type: input
    id: version
    attributes:
      label: MouseDrive version
      description: Shown in the window title.
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: vjoy
    attributes:
      label: vJoy version (Windows)
      description: Windows only; leave empty on Linux.
      placeholder: 2.2.2.0
  - type: input
    id: distro
    attributes:
      label: Distribution (Linux)
      description: Linux only; name and version.
      placeholder: Ubuntu 24.04, Fedora 42, Arch, SteamOS, ...
  - type: dropdown
    id: session
    attributes:
      label: Desktop session (Linux)
      description: Linux only. If you start MouseDrive with `--x11` or `--wayland`, say so in the steps below.
      options:
        - Wayland
        - X11
  - type: dropdown
    id: linux-setup
    attributes:
      label: Linux setup
      description: >-
        Linux only. How were uinput and the udev rules set up? Pick all that apply.
        If a row in the Setup window is not ✔, name it under *What happened?*.
      multiple: true
      options:
        - .deb or .rpm package
        - 70-mousedrive.rules from the Setup window or packaging/README.md
        - Optional keyboard rule (71-mousedrive-keyboard.rules)
        - NixOS configuration from the README
        - input group instead of the uaccess rule (no systemd-logind)
        - Not set up yet
        - Other (describe in the steps)
  - type: input
    id: game
    attributes:
      label: Game
      description: Which game shows the problem? Leave empty if it is not game-specific. On Linux, say whether it runs natively or under Proton/Wine.
      placeholder: ACC, iRacing, LMU, ...
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Open **Connection details** in the bottom line of the main window, click **Copy diagnostics** and paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: >-
        Relevant lines from `mousedrive.log`: in `%APPDATA%\MouseDrive\` on Windows,
        `~/.local/state/mousedrive/` on Linux, or next to the exe in portable mode.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched the existing issues.
          required: true
