body:
  - type: markdown
    attributes:
      value: |
        The **Setup** window and the README's [In-game settings](https://github.com/MouseDrive/MouseDrive#in-game-settings) and [Linux](https://github.com/MouseDrive/MouseDrive#linux) sections answer the most common questions.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: MouseDrive version, operating system and game
      placeholder: v0.7.0, Ubuntu 24.04, Assetto Corsa Competizione under Proton
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Open **Connection details** in the bottom line of the main window, click **Copy diagnostics** and paste the result.
      render: text
